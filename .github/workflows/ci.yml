name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Version bumps are batched into their own release PR — see RELEASING.md.
  # PR-only: a push to main has no "head branch" to judge, and the rule is
  # about how a change ARRIVES on main, not about main's contents.
  release-discipline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The check diffs base...head, so a shallow clone cannot see the
          # merge base and would compare against nothing.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Version bumps must be a standalone release PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/check_release_discipline.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install mypy
      - run: mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pytest-cov pytest-asyncio httpx jsonschema pynacl base58
      - name: Run tests
        if: matrix.python-version != '3.12'
        run: pytest
      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: pytest --cov=colony_sdk --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
